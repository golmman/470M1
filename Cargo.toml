[package]
name = "atomic470m1"
version = "0.1.0"
edition = "2024"
publish = false
description = "An Atomic chess win prover and independent proof checker"
license = "GPL-3.0-or-later"

[[bin]]
name = "470m1"
path = "src/main.rs"

[dependencies]
atomic-movegen = "=2.9.0"
shakmaty = { version = "=0.30.1", features = ["variant"] }
serde_json = "1"
zstd = { version = "=0.13.3", default-features = false }

[profile.release]
debug = false
codegen-units = 1
lto = "fat"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
